name: Dynamic Databricks Notebook Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install jq & curl
      run: sudo apt-get update && sudo apt-get install -y jq curl

    - name: Export notebooks (raw)
      run: |
        ORIGIN_HOST=${{ secrets.DATABRICKS_ORIGIN_HOST }}
        ORIGIN_TOKEN=${{ secrets.DATABRICKS_ORIGIN_TOKEN }}
        NOTEBOOK_BASE="/Workspace/Users/juansmartdt99@outlook.com/INGDATOS2026/proceso"
        NOTEBOOKS=("00_funciones" "00_prepamb" "01_ingest_admisiones" "02_ingest_hospitales" "03_ingest_hcahps" "04_transform" "05_load" "06_grants")
        mkdir -p notebooks_to_deploy
        for nb in "${NOTEBOOKS[@]}"; do
          echo "Exportando $nb..."
          curl -s -X GET \
            -H "Authorization: Bearer $ORIGIN_TOKEN" \
            "$ORIGIN_HOST/api/2.0/workspace/export?path=$NOTEBOOK_BASE/$nb&format=SOURCE&direct_download=true" \
            --output "notebooks_to_deploy/$nb.py"
        done

    - name: Deploy notebooks to Destination Workspace
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        DEST_BASE="/py/scripts/main"
        curl -s -X POST \
          -H "Authorization: Bearer $DEST_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"path\":\"$DEST_BASE\"}" \
          "$DEST_HOST/api/2.0/workspace/mkdirs"
        for file in notebooks_to_deploy/*.py; do
          name=$(basename "$file" .py)
          dest_path="$DEST_BASE/$name"
          echo "Importando $file → $dest_path"
          response=$(curl -s -X POST \
            -H "Authorization: Bearer $DEST_TOKEN" \
            -H "Content-Type: multipart/form-data" \
            -F "path=$dest_path" \
            -F "format=SOURCE" \
            -F "language=PYTHON" \
            -F "overwrite=true" \
            -F "content=@$file" \
            "$DEST_HOST/api/2.0/workspace/import")
          echo "Response: $response"
        done

    - name: Check if workflow exists and delete if necessary
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        WORKFLOW_NAME="WF_ETL_SALUD"
        workflows_response=$(curl -s -G \
          -H "Authorization: Bearer $DEST_TOKEN" \
          --data-urlencode "name=$WORKFLOW_NAME" \
          "$DEST_HOST/api/2.1/jobs/list")
        existing_job_ids=$(echo "$workflows_response" | jq -r --arg name "$WORKFLOW_NAME" '.jobs[]? | select(.settings.name == $name) | .job_id')
        if [ -n "$existing_job_ids" ]; then
          for existing_job_id in $existing_job_ids; do
            echo "Eliminando workflow existente: $existing_job_id"
            curl -s -X POST \
              -H "Authorization: Bearer $DEST_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"job_id\": $existing_job_id}" \
              "$DEST_HOST/api/2.1/jobs/delete"
          done
        fi

    - name: Create Databricks Workflow WF_ETL_SALUD (Serverless)
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        DEST_BASE="/py/scripts/main"

        cat > workflow_config.json << EOF
        {
          "name": "WF_ETL_SALUD",
          "format": "MULTI_TASK",
          "performance_target": "STANDARD",
          "tasks": [
            {
              "task_key": "prepamb",
              "notebook_task": {
                "notebook_path": "$DEST_BASE/00_prepamb",
                "source": "WORKSPACE",
                "base_parameters": { "ambiente": "prod", "storage": "azdatasmart03", "credencial": "cred_salud" }
              },
              "timeout_seconds": 3600,
              "max_retries": 1
            },
            {
              "task_key": "ingest_admisiones",
              "depends_on": [{ "task_key": "prepamb" }],
              "notebook_task": {
                "notebook_path": "$DEST_BASE/01_ingest_admisiones",
                "source": "WORKSPACE",
                "base_parameters": { "ambiente": "prod", "storage": "azdatasmart03" }
              },
              "timeout_seconds": 3600,
              "max_retries": 1
            },
            {
              "task_key": "ingest_hospitales",
              "depends_on": [{ "task_key": "prepamb" }],
              "notebook_task": {
                "notebook_path": "$DEST_BASE/02_ingest_hospitales",
                "source": "WORKSPACE",
                "base_parameters": { "ambiente": "prod", "storage": "azdatasmart03" }
              },
              "timeout_seconds": 3600,
              "max_retries": 1
            },
            {
              "task_key": "ingest_hcahps",
              "depends_on": [{ "task_key": "prepamb" }],
              "notebook_task": {
                "notebook_path": "$DEST_BASE/03_ingest_hcahps",
                "source": "WORKSPACE",
                "base_parameters": { "ambiente": "prod", "storage": "azdatasmart03" }
              },
              "timeout_seconds": 3600,
              "max_retries": 1
            },
            {
              "task_key": "transform",
              "depends_on": [
                { "task_key": "ingest_admisiones" },
                { "task_key": "ingest_hospitales" },
                { "task_key": "ingest_hcahps" }
              ],
              "notebook_task": {
                "notebook_path": "$DEST_BASE/04_transform",
                "source": "WORKSPACE",
                "base_parameters": { "ambiente": "prod", "storage": "azdatasmart03" }
              },
              "timeout_seconds": 3600,
              "max_retries": 1
            },
            {
              "task_key": "load",
              "depends_on": [{ "task_key": "transform" }],
              "notebook_task": {
                "notebook_path": "$DEST_BASE/05_load",
                "source": "WORKSPACE",
                "base_parameters": { "ambiente": "prod", "storage": "azdatasmart03" }
              },
              "timeout_seconds": 3600,
              "max_retries": 1
            },
            {
              "task_key": "grants",
              "depends_on": [{ "task_key": "load" }],
              "notebook_task": {
                "notebook_path": "$DEST_BASE/06_grants",
                "source": "WORKSPACE",
                "base_parameters": { "ambiente": "prod", "grupo": "account users" }
              },
              "timeout_seconds": 3600,
              "max_retries": 1
            }
          ],
          "email_notifications": { "on_failure": [], "on_success": [], "no_alert_for_skipped_runs": false },
          "timeout_seconds": 7200,
          "max_concurrent_runs": 1,
          "tags": { "environment": "production", "created_by": "github_actions", "project": "etl_salud", "compute": "serverless" }
        }
        EOF

        jq empty workflow_config.json || { echo "JSON inválido"; cat workflow_config.json; exit 1; }

        create_response=$(curl -s -X POST \
          -H "Authorization: Bearer $DEST_TOKEN" \
          -H "Content-Type: application/json" \
          -d @workflow_config.json \
          "$DEST_HOST/api/2.1/jobs/create")

        echo "Workflow creation response: $create_response"
        job_id=$(echo "$create_response" | jq -r '.job_id')

        if [ "$job_id" != "" ] && [ "$job_id" != "null" ]; then
          echo "Workflow creado con ID: $job_id"
          echo "JOB_ID=$job_id" >> $GITHUB_ENV
        else
          echo "Error al crear el workflow"
          exit 1
        fi

    - name: Run Workflow Now and Wait
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        JOB_ID="${{ env.JOB_ID }}"

        run_response=$(curl -s -X POST \
          -H "Authorization: Bearer $DEST_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"job_id\": $JOB_ID}" \
          "$DEST_HOST/api/2.1/jobs/run-now")

        run_id=$(echo "$run_response" | jq -r '.run_id')
        echo "Run ID: $run_id"

        for i in $(seq 1 30); do
          sleep 20
          status=$(curl -s -X GET \
            -H "Authorization: Bearer $DEST_TOKEN" \
            "$DEST_HOST/api/2.1/jobs/runs/get?run_id=$run_id")
          life_state=$(echo "$status" | jq -r '.state.life_cycle_state')
          result_state=$(echo "$status" | jq -r '.state.result_state // "PENDING"')
          echo "Intento $i: life_cycle_state=$life_state result_state=$result_state"
          if [ "$life_state" = "TERMINATED" ] || [ "$life_state" = "SKIPPED" ] || [ "$life_state" = "INTERNAL_ERROR" ]; then
            break
          fi
        done

        if [ "$result_state" != "SUCCESS" ]; then
          echo "La ejecución no terminó en éxito: $result_state"
          exit 1
        fi
        echo "Ejecución exitosa del workflow WF_ETL_SALUD"

    - name: Clean up
      if: always()
      run: |
        rm -rf notebooks_to_deploy
        rm -f workflow_config.json
